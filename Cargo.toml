[package]
name = "minitype"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
cpal = "0.18"
enigo = "0.6"
hound = "3.5.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPanel", "NSWindow", "NSResponder", "NSView", "NSVisualEffectView", "NSTextField", "NSControl", "NSScreen", "NSColor", "NSFont", "NSText", "NSGraphics", "NSCell", "NSParagraphStyle", "NSColorSpace", "objc2-core-foundation", "objc2-quartz-core", "NSApplication", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "api-31"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
tray-icon = "0.26.1"
ureq = { version = "3.5.2", features = ["platform-verifier"] }
whisper-rs = { version = "0.16", features = ["metal"] }
wry = "0.57"
